name: Construire l'APK
on:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Preparer le projet Capacitor
        run: |
          mkdir www
          cp index.html style.css urgences.js i18n.js lib.js app.js www/
          echo '{"appId":"com.mahmoh.contacts","appName":"MAHFOUD Contacts","webDir":"www"}' > capacitor.config.json
          npm init -y
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 @capacitor-community/contacts@7 @capacitor/filesystem@7 @capacitor/share@7 @capacitor/local-notifications@7 @capacitor/app@7
          npx cap add android
          npx cap sync android
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.READ_CONTACTS" />\n    <uses-permission android:name="android.permission.WRITE_CONTACTS" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n</manifest>#' $M
          S=android/app/src/main/res/values/strings.xml
          echo "<?xml version='1.0' encoding='utf-8'?>" > $S
          echo "<resources>" >> $S
          echo "<string name='app_name'>MAHFOUD\\'s Contacts</string>" >> $S
          echo "<string name='title_activity_main'>MAHFOUD\\'s Contacts</string>" >> $S
          echo "<string name='package_name'>com.mahmoh.contacts</string>" >> $S
          echo "<string name='custom_url_scheme'>com.mahmoh.contacts</string>" >> $S
          echo "</resources>" >> $S
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          IM=convert
          command -v magick >/dev/null 2>&1 && IM=magick
          R=android/app/src/main/res
          rm -rf $R/mipmap-anydpi-v26
          for p in "mdpi 48" "hdpi 72" "xhdpi 96" "xxhdpi 144" "xxxhdpi 192"; do
            set -- $p
            $IM icon.png -resize ${2}x${2} $R/mipmap-$1/ic_launcher.png
            $IM icon.png -resize ${2}x${2} $R/mipmap-$1/ic_launcher_round.png
          done
      - name: Compiler l'APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: contacts-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
